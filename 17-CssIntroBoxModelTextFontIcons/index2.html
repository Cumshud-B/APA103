<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hamilton Font Family</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=IM+Fell+English:ital@0;1&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style2.css">
</head>

<body>

    <div class="bg-layer"></div>

    <div class="fold-h" style="top: 33.3vh;"></div>
    <div class="fold-h" style="top: 66.6vh;"></div>
    <div class="fold-v" style="left: 33.3vw;"></div>
    <div class="fold-v" style="left: 66.6vw;"></div>

    <div class="wrapper">

        <div class="receipt-box">
            <span>CROSS EQUITABLE LOAN OFFICE</span>
            <span>1802 · CANTON</span>
            <span class="big-num">72.6</span>
            <span>JUNE 1802</span>
        </div>

        <div class="label-the">The</div>

        <div class="title-script">
            <span class="swash-h" style="position:relative;">H</span>amilton
        </div>


        <div class="label-family">Font Family</div>


        <div class="divider">
            <div class="divider-line"></div>
            <span class="divider-ornament">❧</span>
            <div class="divider-line"></div>
        </div>
        <div class="subtitle-row">Script, Serif, &amp; Extras</div>


        <p class="tagline">Crafted Exclusively for the Vintage Design Collection</p>

    </div>

</html>
